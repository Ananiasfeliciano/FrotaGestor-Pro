# ═══════════════════════════════════════════════════════════════════
# FrotaGestor Pro — Docker Compose (Produção Completa)
# ═══════════════════════════════════════════════════════════════════
# Uso:
#   docker compose up -d                   # Iniciar tudo
#   docker compose --profile monitoring up  # Com monitoramento
#   docker compose --profile logging up     # Com ELK Stack
#   docker compose up -d --scale backend=3  # 3 instâncias do backend
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy / Load Balancer / SSL Termination
  # ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: frotagestor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # BACKEND — API Node.js / Express
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: frotagestor-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-frotagestor}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-frotagestor_pro}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://frotagestor-pro.com}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ─────────────────────────────────────────────────────────────────
  # FRONTEND — React SPA via Nginx
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_ID: ${VITE_FIREBASE_MESSAGING_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: frotagestor-frontend
    restart: unless-stopped
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ─────────────────────────────────────────────────────────────────
  # POSTGRESQL — Banco de Dados Principal
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: frotagestor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-frotagestor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-frotagestor_pro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-frotagestor} -d ${DB_NAME:-frotagestor_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ─────────────────────────────────────────────────────────────────
  # REDIS — Cache + Sessões + Filas
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: frotagestor-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M

  # ─────────────────────────────────────────────────────────────────
  # BACKUP — PostgreSQL Backup Automático (cron)
  # ─────────────────────────────────────────────────────────────────
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: frotagestor-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-frotagestor_pro}
      POSTGRES_USER: ${DB_USER:-frotagestor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - db-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  # ═══════════════════════════════════════════════════════════════
  # MONITORAMENTO (profile: monitoring)
  # ═══════════════════════════════════════════════════════════════

  # ── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: frotagestor-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - backend-net
      - monitoring-net

  # ── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: frotagestor-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # ── Node Exporter (métricas de host) ────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: frotagestor-node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-net

  # ── Redis Exporter ──────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: frotagestor-redis-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - monitoring-net

  # ── Postgres Exporter ───────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: frotagestor-postgres-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-frotagestor}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-frotagestor_pro}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
      - monitoring-net

  # ═══════════════════════════════════════════════════════════════
  # LOGGING (profile: logging)
  # ═══════════════════════════════════════════════════════════════

  # ── Elasticsearch ───────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: frotagestor-elasticsearch
    restart: unless-stopped
    profiles: ["logging"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - logging-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Logstash ────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    container_name: frotagestor-logstash
    restart: unless-stopped
    profiles: ["logging"]
    volumes:
      - ./docker/logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - logging-net
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Kibana ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: frotagestor-kibana
    restart: unless-stopped
    profiles: ["logging"]
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - logging-net

  # ── Certbot (SSL renovação) ─────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: frotagestor-certbot
    profiles: ["ssl"]
    volumes:
      - ./docker/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

# ═══════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  db-backups:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
  certbot-webroot:
    driver: local

# ═══════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  logging-net:
    driver: bridge
