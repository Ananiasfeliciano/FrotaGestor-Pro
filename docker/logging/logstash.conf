# ═══════════════════════════════════════════════════════════
# Logstash — Pipeline FrotaGestor Pro
# ═══════════════════════════════════════════════════════════

input {
  # Logs do backend via TCP
  tcp {
    port => 5044
    codec => json_lines
    type => "backend"
  }

  # Logs do Docker
  file {
    path => "/var/log/containers/*.log"
    type => "docker"
    codec => json
  }
}

filter {
  # Adicionar timestamp de processamento
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
  }

  # Parse de logs do backend
  if [type] == "backend" {
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }

    # Extrair informações de requisição HTTP
    if [message] =~ /^(GET|POST|PUT|DELETE|PATCH)/ {
      grok {
        match => { "message" => "%{WORD:http_method} %{URIPATHPARAM:request_path} %{NUMBER:status_code:int} %{NUMBER:response_time:float}" }
        tag_on_failure => ["_grok_parse_failure"]
      }
    }
  }

  # Remover campos sensíveis
  mutate {
    remove_field => ["password", "token", "authorization", "cookie"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "frotagestor-%{type}-%{+YYYY.MM.dd}"
  }

  # Debug (desativar em produção)
  # stdout { codec => rubydebug }
}
